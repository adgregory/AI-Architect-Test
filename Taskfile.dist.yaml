# Task runner (https://taskfile.dev). Copy to Taskfile.yaml for local overrides (git-ignored).
version: "3"

vars:
  STACK: '{{.STACK | default "chosen"}}'          # chosen | fallback
  IMAGE: pdf-name-extractor
  TAG: "{{.STACK}}"
  PORT: '{{.PORT | default "8000"}}'
  CONTAINER: "{{.IMAGE}}-{{.STACK}}"

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ------------------------------------------------------------------ setup
  setup:
    desc: Install all dependencies (both stacks + dev tools), git hooks, and prepare models
    cmds:
      - uv sync --all-extras
      - task: hooks:install
      - task: models:prepare

  models:prepare:
    desc: Download/export the models the configured engines need into MODELS_DIR
    cmds:
      - uv run python scripts/prepare_models.py

  # ------------------------------------------------------------------ quality
  hooks:install:
    desc: Install the pre-commit and pre-push git hooks
    cmds:
      - uv run pre-commit install
      - uv run pre-commit install --hook-type pre-push

  lint:
    desc: All pre-commit hooks on every file (ruff, mypy, uv lock --check, detect-secrets, ...)
    cmds:
      - uv run pre-commit run --all-files

  format:
    desc: Format and auto-fix with ruff
    cmds:
      - uv run ruff check --fix --force-exclude app tests scripts migrations
      - uv run ruff format --force-exclude app tests scripts migrations

  typecheck:
    desc: mypy on the app package
    cmds:
      - uv run mypy

  # ------------------------------------------------------------------ tests
  test:
    desc: Full suite (provided + unit + api + contract + integration)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:fast:
    desc: Tests that need no real models (provided unit tests + our unit/api tests)
    cmds:
      - uv run pytest -m "not contract and not integration" --ignore=tests/test_integration.py {{.CLI_ARGS}}

  test:contract:
    desc: Same behaviour checked against every engine implementation
    cmds:
      - uv run pytest -m contract {{.CLI_ARGS}}

  test:integration:
    desc: End-to-end pipeline on the sample PDFs
    cmds:
      - uv run pytest -m integration tests/test_integration.py tests/integration {{.CLI_ARGS}}

  # ------------------------------------------------------------------ run locally
  run:
    desc: Run the API locally with reload
    cmds:
      - uv run uvicorn app.main:app --reload --port {{.PORT}}

  # ------------------------------------------------------------------ local stack (docker compose)
  stack:up:
    desc: "Build and start the full stack: postgres, temporal(+ui), qdrant, migrate, api, workers (STACK, CPU_WORKERS)"
    cmds:
      - STACK={{.STACK}} CPU_WORKERS={{.CPU_WORKERS | default "1"}} docker compose up -d --build
      - docker compose ps

  stack:infra:
    desc: Start only the infrastructure (run api/workers from the host with `task run` / `task worker:*`)
    cmds:
      - docker compose up -d postgres temporal temporal-ui qdrant
      - task: db:migrate

  stack:down:
    desc: Stop the stack (keeps volumes; add -- -v to drop them)
    cmds:
      - docker compose down {{.CLI_ARGS}}

  stack:logs:
    desc: Follow logs (e.g. task stack:logs -- worker-cpu)
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  db:migrate:
    desc: Apply database migrations
    cmds:
      - uv run alembic upgrade head

  worker:cpu:
    desc: Run a CPU worker on the host
    cmds:
      - uv run python -m app.workers.cpu

  worker:io:
    desc: Run the IO/workflow worker on the host
    cmds:
      - uv run python -m app.workers.io

  job:demo:
    desc: "Submit sample_pdfs/meeting_minutes.pdf as a job and stream its events (API_URL)"
    vars:
      API_URL: '{{.API_URL | default "http://localhost:8000"}}'
    cmds:
      - |
        job=$(curl -fsS -X POST {{.API_URL}}/api/jobs \
          -F "pdf_file=@sample_pdfs/meeting_minutes.pdf;type=application/pdf" \
          -F 'names=[{"first_name":"Richard","last_name":"Hernandez"},{"first_name":"Jenifer","last_name":"Liu"}]' \
          | uv run python -c "import json,sys; print(json.load(sys.stdin)['job_id'])")
        echo "job $job"
        curl -sN {{.API_URL}}/api/jobs/$job/events

  # ------------------------------------------------------------------ docker
  docker:build:
    desc: "Build the image (STACK=chosen|fallback)"
    preconditions:
      - sh: '[ "{{.STACK}}" = "chosen" ] || [ "{{.STACK}}" = "fallback" ]'
        msg: "STACK must be 'chosen' or 'fallback'"
    cmds:
      - docker build --build-arg STACK={{.STACK}} -t {{.IMAGE}}:{{.TAG}} .
      - docker image ls {{.IMAGE}}:{{.TAG}} --format '{{"{{"}}.Repository{{"}}"}}:{{"{{"}}.Tag{{"}}"}} {{"{{"}}.Size{{"}}"}}'

  docker:run:
    desc: "Run the image detached on PORT (STACK=chosen|fallback)"
    cmds:
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
      - docker run -d --name {{.CONTAINER}} -p {{.PORT}}:8000 {{.CLI_ARGS}} {{.IMAGE}}:{{.TAG}}
      - task: docker:wait

  docker:wait:
    internal: true
    cmds:
      - |
        for i in $(seq 1 60); do
          status=$(docker inspect -f '{{"{{"}}.State.Health.Status{{"}}"}}' {{.CONTAINER}} 2>/dev/null)
          [ "$status" = "healthy" ] && echo "{{.CONTAINER}} healthy on :{{.PORT}}" && exit 0
          [ "$status" = "unhealthy" ] && break
          sleep 2
        done
        docker logs --tail 50 {{.CONTAINER}}; exit 1

  docker:smoke:
    desc: "Build, run and exercise the image end to end (STACK=chosen|fallback)"
    cmds:
      - task: docker:build
      - task: docker:run
      - curl -fsS http://localhost:{{.PORT}}/health
      - echo
      - >-
        curl -fsS -X POST http://localhost:{{.PORT}}/api/extract
        -F "pdf_file=@sample_pdfs/meeting_minutes.pdf;type=application/pdf"
        -F 'names=[{"first_name":"Richard","last_name":"Hernandez"},{"first_name":"Jenifer","last_name":"Liu"}]'
        | uv run python -c "import json,sys; d=json.load(sys.stdin); print(len(d['extracted_names']), 'name boxes;', sorted({n['name'] for n in d['extracted_names']})); print('matches:', d['fuzzy_matches'])"
    status: []

  docker:logs:
    desc: Follow the running container's logs
    cmds:
      - docker logs -f {{.CONTAINER}}

  docker:stop:
    desc: Stop and remove the running container
    cmds:
      - docker rm -f {{.CONTAINER}}
