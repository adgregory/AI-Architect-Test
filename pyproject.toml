[project]
name = "pdf-name-extractor"
version = "0.1.0"
description = "Extract names and bounding boxes from scanned PDFs, fuzzy-match them, and answer questions via RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "python-multipart==0.0.9",
    "pymupdf==1.24.0",
    "pytesseract==0.3.10",
    "spacy==3.7.5",
    "en-core-web-sm",
    "thefuzz==0.22.1",
    "python-Levenshtein==0.25.1",
    "sentence-transformers==3.0.0",
    "qdrant-client==1.11.0",
    "pydantic==2.9.0",
]

[dependency-groups]
dev = [
    "httpx==0.27.0",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
